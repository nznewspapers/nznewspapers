
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, follow" />
    <title>Redirecting...</title>
    <script>
      const params = new URLSearchParams(window.location.search);
      const place = params.get("place");
      if (place) {
        // Slugify the place name to match 11ty output (kebab-case)
        const slug = place
          .toLowerCase()
          .trim()
          .replace(/[^\w\s-]/g, "")
          .replace(/[\s_-]+/g, "-")
          .replace(/^-+|-+$/g, "");
        window.location.replace(`/place/${slug}/`);
      } else {
        // Fallback to places list
        window.location.replace("/places/");
      }
    </script>
  </head>
  <body>
    <p>Redirecting to place...</p>
  </body>
</html>
